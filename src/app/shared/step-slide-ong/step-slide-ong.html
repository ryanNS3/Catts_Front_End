<div class="etapa-principal">

  <div class="instituicao-etapa" [class.ativa]="etapa === 1">
    <div class="icone-etapa">
      <span class="icone icone-carteirinha"></span>
    </div>
    <p class="nome-etapas">Instituição</p>
  </div>

  <div class="contato-etapa" [class.ativa]="etapa === 2">
    <div class="icone-etapa">
      <span class="icone icone-mundo"></span>
    </div>
    <p class="nome-etapas">Contato/horário</p>
  </div>

  <div class="localidade-etapa" [class.ativa]="etapa === 3">
    <div class="icone-etapa">
      <span class="icone icone-face"></span>
    </div>
    <p class="nome-etapas">Localidade</p>
  </div>

</div>
