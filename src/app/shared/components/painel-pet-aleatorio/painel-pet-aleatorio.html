<section class="login">
  @if (animalAleatorio; as gato) {
    @if (gato.image?.linkId; as foto) {
      <img class="gato-img" [src]="urlDaFoto(foto)" [alt]="gato.name" />
    }

    <div class="informacoes-gato">
      <span>{{ gato.ong?.nomeInstitucional || 'ONG Parceira' }}</span>

      <h2>{{ nomeIdadeGatos() }}</h2>

      <p class="observacao-gato">{{ observacaoDoGato() }}</p>
    </div>
  }
</section>
