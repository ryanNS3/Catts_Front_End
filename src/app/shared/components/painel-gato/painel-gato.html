<section class="login">
  @if (animalSelecionado() || gatoSorteado(); as gato) {
    @if (gato.image?.linkId; as foto) {
      <img class="gato-img" [src]="foto" [alt]="gato.name">
    }

    <div class="informacoes-gato">
      <span>{{ gato.ong?.nomeInstitucional || 'ONG Parceira' }}</span>

      <h2>{{ nomeIdadeGatos(gato.name, gato.age) }}</h2>

      <p class="observacao-gato">
        {{ gato.description || observacaoDoGato(gato.name) }}
      </p>
    </div>
  }
</section>
