

<style>
:host { display: inline-block; }

:host { display: inline-block; }

.botao-ghost {
  
  position: relative;
  padding: 11px 39px;
  width: 155px;
  height: 53px;
  
  background: transparent;
  color: #000;
  font: 600 14px Inter, sans-serif;
  margin-left: 353px; 

  
}

.botao-ghost span {
  position: relative;
  display: inline-block;
  width: 90px;
  height: 20px;
  line-height: 20px;
  text-align: center;
}

.botao-ghost img { position: absolute; inset: 0; width: 151px; height: 48px;  }
.botao-ghost span { position: relative; }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rabisco">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="ruido" />
    <feDisplacementMap in="SourceGraphic" in2="ruido" scale="13" />
  </filter>
</svg>

<button
   [routerLink]="toUrl" (click)="aoClicar()" class="botao-ghost">
   <img src="/botao-ghost.svg" alt="" /> 
   <span>Doar/Adotar</span>
  
  
<ng-content></ng-content>
</button>
