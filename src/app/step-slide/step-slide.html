      <span class="icone icone-carteirinha"></span>
    </div>
    <p class="nome-etapas">Dados pessoais</p>
  </div>

  <div class="endereco-etapa" [class.ativa]="etapa === 2">

      <span class="icone icone-mundo"></span>

  <div class="seu-perfil-etapa" [class.ativa]="etapa === 3">
