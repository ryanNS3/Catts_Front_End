<app-botao-voltar (voltar)="voltar.emit()" />

<app-step-slide-ong [etapa]="2" />

<h1 class="titulo">Contato</h1>
<p class="subtitulo">Preencha todos os campos</p>

<div class="campos">

  <!-- WHATSAPP -->
  <app-campo-texto label="WhatsApp" idInput="whatsapp" placeholder="11 906377-9077" [maximo]="12"
    [controlPai]="$any(formulario.get('whatsapp'))"
    
  />

  <!-- INSTAGRAM -->
  <app-campo-texto label="Instagram (Opcional)" idInput="instagram" placeholder="@amigosgatos"
  [controlPai]="$any(formulario.get('instagram'))"
  />

  <!-- FACEBOOK -->
  <app-campo-texto label="Facebook (Opcional)" idInput="facebook" placeholder="facebook.com/amigosgatos"
    [controlPai]="$any(formulario.get('facebook'))"
  />

  <!-- HORÁRIOS -->
  <div class="horarios">
    <div class="horario">
      <app-campo-texto label="Horário início" idInput="inicio" placeholder="9:00"
        [controlPai]="$any(formulario.get('horarioInicio'))"
      />
    </div>

    <div class="horario">
      <app-campo-texto label="Horário fim" idInput="fim" placeholder="18:00"
        [controlPai]="$any(formulario.get('horarioFim'))"
      />
    </div>

  </div>

  <!-- DIAS DE ATENDIMENTO -->
  <p class="text-form">Disponibilidade de atendimento</p>

  <div class="dias">

    @for (dia of dias; track dia) {

      <button type="button" class="dia" [class.selecionado]="estaSelecionado(dia)" (click)="alternarDia(dia)"> {{ dia }}
      </button>

    }

  </div>

</div>
