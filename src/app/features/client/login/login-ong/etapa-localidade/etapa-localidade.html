<app-botao-voltar (voltar)="voltar.emit()"></app-botao-voltar>

<app-step-slide-ong [etapa]="3"></app-step-slide-ong>

<h1 class="titulo">Localidade</h1>
<p class="subtitulo">Preencha todos os campos</p>

<div class="campos">

  <!-- CEP -->
  <div class="grupo">

    <app-campo-texto label="CEP" idInput="cep" placeholder="00000-000" [maximo]="9"
      [controlPai]="$any(formulario.get('cep'))"[erroExterno]="erroCep() !== ''"
      (saiuDoCampo)="buscarCep()"></app-campo-texto>

    @if (buscando()) {
      <span class="aviso">Buscando...</span>
    }

    @if (erroCep()) {
      <span class="aviso erro">{{ erroCep() }}</span>
    }

  </div>

  <!-- RUA E CIDADE -->
  <div class="linha">

    <div class="grupo">
      <label class="text-form bloqueado" for="rua">Rua</label>
      <input class="campo" type="text" id="rua" 
      [value]="formulario.get('rua')?.value" disabled>
    </div>

    <div class="grupo">
      <label class="text-form bloqueado" for="cidade">Cidade</label>
      <input class="campo" type="text" id="cidade"
        [value]="formulario.get('cidade')?.value"disabled>
    </div>

  </div>

  <!-- ESTADO -->
  <div class="grupo">

    <label class="text-form bloqueado" for="estado">Estado</label>

    <input class="campo" type="text" id="estado" 
    [value]="formulario.get('estado')?.value" disabled>

  </div>

  <!-- COMPLEMENTO -->
  <div class="grupo">

    <app-campo-texto label="Complemento" idInput="complemento" placeholder="Shopping SP"
    [controlPai]="$any(formulario.get('complemento'))"></app-campo-texto>

  </div>

</div>
