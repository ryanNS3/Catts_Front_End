<main class="container">
  
  @if (mostrarToast) {
  <app-toast [mensagem]="mensagemToast" [tipo]="tipoToast" (fechar)="mostrarToast = false"
  />
}

<app-painel-pet-aleatorio> </app-painel-pet-aleatorio>

  <section class="formulario"
    [class.etapa-instituicao]="etapa === 1"
    [class.etapa-contato]="etapa === 2"
    [class.etapa-localidade]="etapa === 3">

    @if (etapa === 1) {

      <app-botao-voltar (voltar)="voltarParaPerfil()" />

      <app-etapa-dados-da-instituicao [formulario]="dadosInstituicao" />

      <app-botao-azul class="botao-azul1" texto="Continuar" (acaoBotao)="continuar()"></app-botao-azul>
    }

    @if (etapa === 2) {
      <app-etapa-contato   [formulario]="contato" (voltar)="voltar()" />

      <app-botao-azul class="botao-azul2" texto="Continuar" (acaoBotao)="continuar()"></app-botao-azul>
    }

    @if (etapa === 3) {
      <app-etapa-localidade [formulario]="localidade" (voltar)="voltar()" />
      
      <app-botao-azul class="botao-azul3" [texto]="salvandoCadastro ? 'Enviando...' : 'Finalizar'" (acaoBotao)="continuar()" />


    }

  </section>

</main>
