<main class="container">

    <app-painel-gato />

    <!-- LADO DIREITO -->
    <section class="formulario" [class.etapa-zero]="etapa === 0">

      <!-- ETAPA 0: LOGIN -->
      @if (etapa === 0) {
        <app-botao-voltar  [irParaFeed]="true" />

        <div  class="titulo">

        <h1 class="sign-in">Sign in</h1>

        <p class="sub-0">Selecione uma das opções abaixo para fazer o login</p>

         <app-botao-azul texto="Continuar" (acaoBotao)="continuar()"></app-botao-azul>
        </div>

        <div class="google-button" #googleButton></div>
      }

      <!-- ETAPA 1: DADOS PESSOAIS -->
      @if (etapa === 1) {
  <app-etapa-dados-pessoais [formulario]="dadosPessoais" (voltar)="voltar()"
  />

  <app-botao-azul  class="botao-azul1" texto="Continuar" (acaoBotao)="continuar()"
  />


      }

      <!-- ETAPA 2: ENDEREÇO -->
      @if (etapa === 2) {
        <app-etapa-endereco [formulario]="endereco"   (voltar)="voltar()" />
        <app-botao-azul class="botao-azul2" texto="Continuar" (acaoBotao)="continuar()"></app-botao-azul>

      }

      <!-- ETAPA 3: PERFIL -->
      @if (etapa === 3) {
        <app-etapa-perfil [formulario]="perfil" (voltar)="voltar()" />
        <app-botao-azul class="botao-azul3" texto="Continuar" (acaoBotao)="continuar()"></app-botao-azul>

      }

    </section>

  
</main>
