<main class="container">

 
@if (mostrarToast) {
  <app-toast [mensagem]="mensagemToast" [tipo]="tipoToast" (fechar)="mostrarToast = false" />
}

    <app-painel-gato />

    <!-- LADO DIREITO -->
    <section class="formulario">

      <!-- ETAPA 1: DADOS PESSOAIS -->
      @if (etapa === 1) {
        <app-etapa-dados-pessoais [formulario]="dadosPessoais" (voltar)="voltar()" />
        <app-botao-azul  class="botao-azul1" texto="Continuar" (acaoBotao)="continuar()" />


      }

      <!-- ETAPA 2: ENDEREÇO -->
      @if (etapa === 2) {
        <app-etapa-endereco [formulario]="endereco"   (voltar)="voltar()" />
        <app-botao-azul class="botao-azul2" texto="Continuar" (acaoBotao)="continuar()"></app-botao-azul>

      }

      <!-- ETAPA 3: PERFIL -->
      @if (etapa === 3) {
        <app-etapa-perfil [formulario]="perfil" (voltar)="voltar()" />
        <app-botao-azul class="botao-azul3" texto="Continuar" (acaoBotao)="continuar()"></app-botao-azul>

      }
    </section>

  
</main>
