
<app-client-nav-bar></app-client-nav-bar>

<main class="feed">

  <!-- Cabeçalho -->
  <section class="feed-cabecalho">
    <h1>Feed</h1>

    <!-- Pesquisa e filtro -->
    <div class="feed-pesquisa">
      <div class="campo-pesquisa">
        <input type="text" placeholder="Pesquisar" aria-label="Pesquisar gatos">
      </div>

      <button class="botao-filtro" aria-label="Filtrar gatos">
        <img src="/Icones/icone-filtro.svg" alt="Filtrar">
      </button>
    </div>
  </section>

  <!-- Grid de gatos -->
  <section class="feed-bloco">
    <div class="feed-layout">

      @for (gato of animalList(); track gato.id) {
        <article class="card" (click)="abrirModal(gato)">

          <img
            class="imagem-gato"
            [src]="gato.image?.linkId || 'https://via.placeholder.com/300'"
            [alt]="gato.name">

          <button
            class="botao-salvar"
            aria-label="Salvar gato"
            (click)="$event.stopPropagation()">

            <img src="/Icones/icone-salvar.svg" alt="">
          </button>

          <div class="info-gato">
            <span>{{ gato.ong?.nomeInstitucional || 'ONG Parceira' }}</span>
            <p>{{ gato.name }} - {{ gato.age }} anos</p>
          </div>

        </article>
      }

    </div>
  </section>

</main>

@if (animalSelecionado) {
  <app-animal-modal
    [animal]="animalSelecionado"
    (fechar)="fecharModal()"
    (adotar)="adotarAnimal($event)"/>
}
