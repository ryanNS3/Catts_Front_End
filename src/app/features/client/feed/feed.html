<app-client-nav-bar></app-client-nav-bar>

<main class="feed">

  <!-- Cabeçalho -->
  <section class="feed-cabecalho">
    <h1>Feed</h1>

    <!-- Pesquisa e filtro -->
    <div class="feed-pesquisa">
      <div class="campo-pesquisa">
        <input type="text" placeholder="Pesquisar" aria-label="Pesquisar gatos">
      </div>

      <button class="botao-filtro" aria-label="Filtrar gatos">
        <img src="/Icones/icone-filtro.svg" alt="Filtrar">
      </button>
    </div>
  </section>

  <!-- Grid de Gatos Dinâmico -->
  <section class="feed-bloco">
    <div class="feed-layout" style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px;">

      @for (gato of animalList(); track gato.id) {
        <article class="card card-lateral" (click)="abrirModal(gato)" style="cursor: pointer; width: 300px; border: 1px solid #ddd; border-radius: 8px; padding: 10px;">

          <img class="imagem-gato" [src]="gato.image?.linkId || 'https://via.placeholder.com/300'" [alt]="gato.name" style="width: 100%; height: 200px; object-fit: cover; border-radius: 6px;">

          <button class="botao-salvar" aria-label="Salvar gato" (click)="$event.stopPropagation()">
            <img src="/Icones/icone-salvar.svg" alt="">
          </button>

          <div class="info-gato" style="margin-top: 10px;">
            <span style="font-size: 12px; color: #666;">{{ gato.ong?.nomeInstitucional || 'ONG Parceira' }}</span>
            <p style="font-weight: bold; margin: 5px 0;">{{ gato.name }} - {{ gato.age }} anos</p>
          </div>

        </article>
      }

    </div>
  </section>

</main>

@if (animalSelecionado) {
  <app-animal-modal
    [animal]="animalSelecionado"
    (fechar)="fecharModal()"
    (adotar)="adotarAnimal($event)"/>
}
